services:
  - type: web
    name: shinomontazh-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_ID
        value: demo
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3100
      - key: DATA_DIR
        value: /data
      - key: DEMO_MODE
        value: "false"
      - key: TZ
        value: Europe/Moscow
